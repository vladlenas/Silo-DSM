id: "dsm-ui"
name: "DSM Style UI"
version: "1.0.0"
author: "vladlenas"
description: "Silo library in the style of Synology DSM. Uses the logic of the built-in Default Web UI, which must stay enabled."
theme_ui: true
entry: "service.js"
icon: "/img/logo.png"

events: []

routes:
  - "/"
  - "/index.html"
  - "/css/*"
  - "/js/*"
  - "/img/*"
  - "/i18n/*"
