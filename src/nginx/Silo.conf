location = /webman/3rdparty/TorrServerSilo/helper {
    return 301 /webman/3rdparty/TorrServerSilo/helper/;
}

location ^~ /webman/3rdparty/TorrServerSilo/helper/ {
    proxy_pass http://127.0.0.1:42778/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The helper authenticates the DSM session itself and needs these.
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-SYNO-TOKEN $http_x_syno_token;

    proxy_redirect off;
}
